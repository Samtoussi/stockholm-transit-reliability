version: 2

models:

  - name: reliability_stop_observations
    description: >
      Stop-level realtime observations matched against the scheduled GTFS
      timetable and enriched with route, trip, and stop information.

    columns:
      - name: service_date
        description: GTFS service date for the observed trip.
        tests:
          - not_null

      - name: trip_id
        description: Unique identifier for the scheduled trip.
        tests:
          - not_null

      - name: route_id
        description: Route associated with the trip.
        tests:
          - not_null

      - name: stop_id
        description: Stop associated with the observation.
        tests:
          - not_null

      - name: stop_sequence
        description: Position of the stop within the trip.
        tests:
          - not_null

      - name: feed_timestamp
        description: Timestamp of the GTFS-Realtime snapshot.
        tests:
          - not_null

      - name: transport_mode
        description: Transport mode associated with the route.
        tests:
          - not_null


  - name: reliability_stop_events
    description: >
      Canonical stop-level reliability events derived from GTFS-Realtime
      snapshot history. One row per service date, trip, stop, and stop sequence.

    columns:
      - name: service_date
        tests:
          - not_null

      - name: trip_id
        tests:
          - not_null

      - name: stop_id
        tests:
          - not_null

      - name: stop_sequence
        tests:
          - not_null

      - name: route_id
        tests:
          - not_null

      - name: transport_mode
        tests:
          - not_null

      - name: feed_timestamp
        tests:
          - not_null


  - name: route_reliability
    description: >
      Aggregated route-level reliability metrics derived from canonical
      stop-level reliability events.

    columns:
      - name: route_id
        tests:
          - not_null

      - name: transport_mode
        tests:
          - not_null

      - name: observations
        tests:
          - not_null

      - name: avg_arrival_delay_seconds
        tests:
          - not_null

      - name: median_arrival_delay_seconds
        tests:
          - not_null

      - name: p95_arrival_delay_seconds
        tests:
          - not_null

      - name: on_time_pct
        tests:
          - not_null

      - name: over_5_min_late_pct
        tests:
          - not_null

      - name: over_10_min_late_pct
        tests:
          - not_null


  - name: stop_reliability
    description: >
      Aggregated stop-level reliability metrics derived from canonical
      stop-level reliability events.

    columns:
      - name: stop_id
        tests:
          - not_null

      - name: stop_name
        tests:
          - not_null

      - name: transport_mode
        tests:
          - not_null

      - name: observations
        tests:
          - not_null

      - name: avg_arrival_delay_seconds
        tests:
          - not_null

      - name: median_arrival_delay_seconds
        tests:
          - not_null

      - name: p95_arrival_delay_seconds
        tests:
          - not_null

      - name: on_time_pct
        tests:
          - not_null

      - name: over_5_min_late_pct
        tests:
          - not_null

      - name: over_10_min_late_pct
        tests:
          - not_null


  - name: hourly_reliability_patterns
    description: >
      Reliability metrics aggregated by scheduled hour of day
      and transport mode.

    columns:
      - name: transport_mode
        tests:
          - not_null

      - name: scheduled_hour
        tests:
          - not_null

      - name: observations
        tests:
          - not_null

      - name: avg_arrival_delay_seconds
        tests:
          - not_null

      - name: median_arrival_delay_seconds
        tests:
          - not_null

      - name: p95_arrival_delay_seconds
        tests:
          - not_null

      - name: on_time_pct
        tests:
          - not_null

      - name: over_5_min_late_pct
        tests:
          - not_null

      - name: over_10_min_late_pct
        tests:
          - not_null


  - name: daily_reliability_metrics
    description: >
      Daily reliability metrics aggregated by service date
      and transport mode.

    columns:
      - name: service_date
        tests:
          - not_null

      - name: transport_mode
        tests:
          - not_null

      - name: observations
        tests:
          - not_null

      - name: avg_arrival_delay_seconds
        tests:
          - not_null

      - name: median_arrival_delay_seconds
        tests:
          - not_null

      - name: p95_arrival_delay_seconds
        tests:
          - not_null

      - name: on_time_pct
        tests:
          - not_null

      - name: over_5_min_late_pct
        tests:
          - not_null

      - name: over_10_min_late_pct
        tests:
          - not_null


  - name: route_stop_reliability
    description: >
      Route-level reliability metrics by stop, derived from canonical
      GTFS-Realtime stop events. One row per route and stop combination.

    columns:
      - name: route_id
        tests:
          - not_null

      - name: stop_id
        tests:
          - not_null

      - name: transport_mode
        tests:
          - not_null

      - name: stop_events
        tests:
          - not_null

      - name: on_time_pct
        tests:
          - not_null


  - name: route_direction_reliability
    description: >
      Route reliability metrics by GTFS direction, derived from canonical
      realtime stop events. One row per route and direction.

    columns:
      - name: route_id
        tests:
          - not_null

      - name: direction_id
        tests:
          - not_null

      - name: transport_mode
        tests:
          - not_null

      - name: stop_events
        tests:
          - not_null

      - name: on_time_pct
        tests:
          - not_null


  - name: route_hourly_reliability
    description: >
      Route reliability metrics by scheduled service hour, derived from
      canonical realtime stop events. One row per route and scheduled hour.

    columns:
      - name: route_id
        tests:
          - not_null

      - name: scheduled_hour
        tests:
          - not_null

      - name: transport_mode
        tests:
          - not_null

      - name: stop_events
        tests:
          - not_null

      - name: on_time_pct
        tests:
          - not_null


  - name: delay_propagation_stop_events
    description: >
      Canonical stop events enriched with the previous stop's arrival delay
      for the same trip. Used to measure delay accumulation and recovery
      between consecutive stops.

    columns:
      - name: service_date
        tests:
          - not_null

      - name: trip_id
        tests:
          - not_null

      - name: stop_id
        tests:
          - not_null

      - name: stop_sequence
        tests:
          - not_null

      - name: route_id
        tests:
          - not_null

      - name: transport_mode
        tests:
          - not_null

      - name: arrival_delay_seconds
        tests:
          - not_null

      - name: is_extreme_propagation
        description: >
          Flags consecutive-stop delay changes greater than 600 seconds
          in absolute magnitude. Null for the first observed stop of a trip.


  - name: route_delay_propagation
    description: >
      Route-level delay propagation metrics derived from consecutive
      canonical stop events. Extreme stop-to-stop delay changes above
      10 minutes are retained for quality monitoring but excluded from
      normal accumulation and recovery metrics.

    columns:
      - name: route_id
        tests:
          - not_null

      - name: transport_mode
        tests:
          - not_null

      - name: propagation_events
        tests:
          - not_null

      - name: extreme_propagation_events
        tests:
          - not_null

      - name: extreme_propagation_pct
        tests:
          - not_null

      - name: avg_delay_change_seconds
        description: >
          Average stop-to-stop delay change across non-extreme propagation
          events. Null when a route has no non-extreme propagation events.

      - name: pct_delay_accumulated
        description: >
          Percentage of non-extreme propagation events where delay increased.
          Null when a route has no non-extreme propagation events.

      - name: pct_delay_recovered
        description: >
          Percentage of non-extreme propagation events where delay decreased.
          Null when a route has no non-extreme propagation events.

  - name: route_weekday_reliability
    description: >
      Route reliability metrics by day of week, derived from canonical
      realtime stop events. One row per route and weekday.

    columns:
      - name: route_id
        tests:
          - not_null

      - name: transport_mode
        tests:
          - not_null

      - name: day_of_week_number
        tests:
          - not_null

      - name: day_of_week
        tests:
          - not_null

      - name: stop_events
        tests:
          - not_null

      - name: avg_arrival_delay_seconds
        tests:
          - not_null

      - name: median_arrival_delay_seconds
        tests:
          - not_null

      - name: p95_arrival_delay_seconds
        tests:
          - not_null

      - name: on_time_pct
        tests:
          - not_null

      - name: over_5_min_late_pct
        tests:
          - not_null

      - name: over_10_min_late_pct
        tests:
          - not_null          